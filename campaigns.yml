# Campaign configuration
# Maps grouptag names (from OpenSenseMap) to campaign-specific settings.
# road_network: list of place dicts passed to OSMNX graph_from_place() for
# importing the bicycle road network from OpenStreetMap.
# Add a new entry here whenever a new grouptag/campaign is activated.
campaigns:
  atrai:
    road_network:
      - city: Münster
        country: Germany

  heilbronn:
    road_network:
      - city: Heilbronn
        country: Germany
    home_devices:
      table: osem_home_data_heilbronn
      grouptag: GreenCityHN
      box_ids:
        - 6a8e94d9852a4900074fe57c  # experimenta Sternwarte
        - 68db27a2ab896a0008a5109a  # THW Heilbronn

  lauds_26:
    road_network:
      - city: Nancy
        country: France

  arnsberg:
    road_network:
      - city: Arnsberg
        county: Hochsauerlandkreis
        country: Germany

  muenster:
    road_network:
      - city: Münster
        country: Germany

  greifswald:
    road_network:
      - city: Greifswald
        country: Germany

  wiesbaden:
    road_network:
      - city: Wiesbaden
        country: Germany
      - city: Mainz
        country: Germany

  saopaulo:
    road_network:
      - city: Sao Paulo
        country: Brazil
